<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Music Listening</title>
<style>
  :root{
    --bg: #121212;
    --panel: rgba(24,24,24,0.92);
    --text: #ffffff;
    --muted: #b3b3b3;
    --accent: #1db954;
  }
  [data-theme="light"]{
    --bg: #f2f2f2;
    --panel: rgba(255,255,255,0.95);
    --text: #111;
    --muted: #555;
    --accent: #0a84ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  #blur-bg{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(40px) saturate(0.8) brightness(0.45);z-index:-1;transition:background-image .4s ease}
  .app{width: min(980px, 98%);display:flex;gap:20px;align-items:flex-start}
  .playlist-panel{width:320px;background:var(--panel);border-radius:14px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,0.4);}
  .heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .heading h3{margin:0;font-size:16px}
  .controls-left{display:flex;gap:8px;align-items:center}
  .theme-toggle{cursor:pointer;padding:8px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.04)}
  .fav-btn{cursor:pointer;padding:8px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.04);font-weight:600}
  .playlist-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .pl-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer}
  .pl-item.active{background:rgba(255,255,255,0.03)}
  .pl-item .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-controls{display:flex;gap:6px}
  .btn{cursor:pointer;padding:6px 8px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.04)}
  .playlist{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:6px}
  .track{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;transition:background .15s}
  .track:hover{background:rgba(255,255,255,0.03)}
  .track.active{background:linear-gradient(90deg, rgba(29,185,84,0.12), transparent)}
  .thumb{width:56px;height:56px;border-radius:8px;background:#333;flex-shrink:0;background-size:cover;background-position:center}
  .meta{flex:1;min-width:0}
  .meta .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .heart { cursor:pointer;font-size:18px;color:var(--muted);transition:transform .12s,color .12s;user-select:none;padding:4px;display:flex;align-items:center;}
  .heart.active{color:#ff3b5c;transform:scale(1.05);text-shadow:0 0 8px rgba(255,60,90,0.35)}
  .add-btn{cursor:pointer;padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent}
  .playlist-menu{position:absolute;background:var(--panel);border-radius:8px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,0.6);z-index:2000;min-width:160px}
  .playlist-menu .row{display:flex;align-items:center;justify-content:space-between;padding:6px;border-radius:6px;cursor:pointer}
  .playlist-menu .row:hover{background:rgba(255,255,255,0.02)}
  .input-inline{display:flex;gap:8px;margin-top:8px}
  .input-inline input{flex:1;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text)}
  .input-inline button{padding:6px 8px;border-radius:6px}
  .player-panel{flex:1;background:var(--panel);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 30px rgba(0,0,0,0.45)}
  .now{display:flex;gap:18px;align-items:center}
  .cover{width:180px;height:180px;border-radius:12px;background:#333;background-size:cover;background-position:center;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
  .meta-big{flex:1}
  .meta-big .title{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta-big .artist{color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fullscreen-btn{margin-left:auto;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);cursor:pointer}
  .visualizer-canvas{width:100%;height:120px;border-radius:8px;background:linear-gradient(180deg, rgba(0,0,0,0.15), rgba(255,255,255,0.02));display:block}
  .controls-row{display:flex;align-items:center;gap:12px}
  .big-play{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#000;font-weight:700;cursor:pointer;box-shadow:0 8px 30px rgba(29,185,84,0.18)}
  .progress-wrap{display:flex;flex-direction:column;gap:6px}
  .progress{height:8px;background:rgba(255,255,255,0.06);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent), #7ef3a8);width:0%}
  .time-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .volume{display:flex;align-items:center;gap:8px}
  input[type=range]{appearance:none;height:6px;background:transparent;outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:6px;background:rgba(255,255,255,0.08);border-radius:6px}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:-4px}
  .bottom-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:12px}
  .now-playing-overlay{position:fixed;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0.95));display:none;align-items:center;justify-content:center;z-index:1000}
  .now-playing-overlay.show{display:flex}
  .overlay-card{width:100%;max-width:900px;padding:24px;border-radius:12px;background:transparent;color:var(--text);display:flex;gap:20px;align-items:center}
  .overlay-cover{width:320px;height:320px;border-radius:12px;background-size:cover;background-position:center;box-shadow:0 30px 80px rgba(0,0,0,0.7)}
  .overlay-meta{flex:1}
  .overlay-meta .title{font-size:36px}
  .close-full{position:absolute;top:18px;right:18px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);cursor:pointer}
  #loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5000;gap:20px;transition: opacity 0.8s ease, transform 0.8s ease;}
  #loader.hide{opacity:0;transform: scale(0.8);pointer-events:none;}
  #loader img{width:180px;height:180px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.6);animation: pulse 1.5s infinite alternate;}
  #loader div{font-size:28px;font-weight:700;color:var(--accent);animation: pulseText 1.5s infinite alternate;}
  @keyframes pulse{0%{ transform: scale(1); opacity:0.8; }100%{ transform: scale(1.15); opacity:1; }}
  @keyframes pulseText{0%{ opacity:0.7; }100%{ opacity:1; }}
  @media (max-width:900px){.app{flex-direction:column;align-items:stretch}.playlist-panel{width:100%}.player-panel{width:100%}.cover{width:120px;height:120px}}
  .empty-msg{padding:18px;color:var(--muted);text-align:center}
</style>
</head>
<body data-theme="dark">

<!-- Loader -->
<div id="loader">
  <img id="loaderCover" src="converted.jpg" alt="Не загрузило логотип (проблемы с интернетом)">
  <div> Music Player </div>
</div>

<div id="blur-bg"></div>
<div class="app" style="display:none">
  <aside class="playlist-panel">
    <div class="heading">
      <div class="controls-left">
        <h3>Плейлисты</h3>
        <button id="showFavsBtn" class="fav-btn" title="Показать только избранное">❤️ Favs</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="newPlBtn" class="btn" title="Создать новый плейлист">+ Новый</button>
        <button class="theme-toggle" id="themeToggle">Toggle</button>
      </div>
    </div>

    <div id="playlistList" class="playlist-list"></div>

    <div id="playlist" class="playlist"></div>
    <div id="emptyMsg" class="empty-msg" style="display:none">Нет треков</div>
    <div style="margin-top:10px;color:var(--muted);font-size:13px"></div>
  </aside>

  <main class="player-panel">
    <div class="now">
      <div class="cover" id="cover"></div>
      <div class="meta-big">
        <div class="title" id="title">Название трека</div>
        <div class="artist" id="artist">Исполнитель</div>
      </div>
      <button class="fullscreen-btn" id="openFull">Открыть</button>
    </div>

    <canvas id="visualizer" class="visualizer-canvas"></canvas>

    <div class="controls-row">
      <div class="big-play" id="playBtn">▶</div>
      <div style="flex:1">
        <div class="progress-wrap">
          <div class="progress" id="progressBar"><span id="progressFill"></span></div>
          <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
        </div>
        <div class="bottom-row">
          <div class="volume"><span>🔊</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.7"></div>
          <div style="display:flex;gap:10px;align-items:center"><button id="prev">⏮</button><button id="next">⏭</button></div>
        </div>
      </div>
    </div>

    <div style="margin-top:6px;color:var(--muted);font-size:13px">Свайп влево/вправо на телефоне - переключает треки.</div>
  </main>
</div>

<!-- playlist menu container (for add-to-playlist dropdown) -->
<div id="playlistMenu" class="playlist-menu" style="display:none;position:fixed"></div>

<!-- fullscreen overlay -->
<div class="now-playing-overlay" id="overlay">
  <button class="close-full" id="closeFull">Закрыть</button>
  <div class="overlay-card">
    <div class="overlay-cover" id="overlayCover"></div>
    <div class="overlay-meta">
      <div class="title" id="overlayTitle">Название</div>
      <div class="artist" id="overlayArtist">Исполнитель</div>
      <canvas id="overlayViz" style="margin-top:18px;width:100%;height:220px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.05));"></canvas>
      <div style="margin-top:16px;display:flex;gap:12px;align-items:center">
        <div class="big-play" id="overlayPlay">▶</div>
        <div style="flex:1">
          <div class="progress" style="height:10px"><span id="overlayFill" style="height:100%;display:block;width:0;background:linear-gradient(90deg,var(--accent),#7ef3a8)"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
/* ---------------------------
   Треки: (оставил как у тебя)
   Поменяй src/cover, если нужно
---------------------------- */
const tracks = [
  {src:'music1.mp3', title:'Feel Good Inc.', artist:'Gorillaz', cover:'cover1.jpg'},
  {src:'Eminem - Lose Yourself From 8 Mile Soundtrack.mp3', title:'Lose Yourself', artist:'Eminem', cover:'cover2.jpg'},
  {src:'Coolio, LV - Gangstas Paradise.mp3', title:'Gangstas Paradise', artist:'Coolio, LV', cover:'cover3.jpg'},
  {src:'Lil Peep, XXXTENTACION - Falling Down Bonus Track.mp3', title:'Falling Down', artist:'Lil Peep, XXXTENTACION', cover:'cover4.jpg'},
  {src:'Arctic Monkeys - I Wanna Be Yours.mp3', title:'I Wanna Be Yours', artist:'Arctic Monkeys', cover:'cover5.jpg'}
];

/* ---------------------------
   Хранение плейлистов в localStorage
   Формат:
   state = {
     playlists: [{id: <num>, name: <string>, tracks: [indices] }, ...],
     nextId: <num>
   }
   По умолчанию создаются: "All tracks" (virtual), "Favorites" (virtual), и "Тренировка" (пример)
---------------------------- */
const LS_KEY = 'music_player_state_v2';
let state = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
if(!state){
  state = {
    playlists: [
      // user playlists only. "all" and "favorites" are virtual and not stored here.
      {id:1, name:'Мой плейлист', tracks: [0,2,4]},
    ],
    nextId: 2
  };
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

// favorites хранится отдельно для удобства (массив индексов)
let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

// UI и DOM
const loader = document.getElementById('loader');
const loaderCover = document.getElementById('loaderCover');
const app = document.querySelector('.app');
loaderCover.src = tracks[0].cover;

window.addEventListener('load', ()=>{
  setTimeout(()=>{
    loader.classList.add('hide'); app.style.display='flex';
  }, 600);
});

/* DOM refs */
const playlistEl = document.getElementById('playlist');
const playlistListEl = document.getElementById('playlistList');
const emptyMsg = document.getElementById('emptyMsg');
const playlistMenu = document.getElementById('playlistMenu');

const audio = document.getElementById('audio');
const coverEl = document.getElementById('cover');
const titleEl = document.getElementById('title');
const artistEl = document.getElementById('artist');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const progressFill = document.getElementById('progressFill');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const volume = document.getElementById('volume');
const openFull = document.getElementById('openFull');
const overlay = document.getElementById('overlay');
const closeFull = document.getElementById('closeFull');
const overlayCover = document.getElementById('overlayCover');
const overlayTitle = document.getElementById('overlayTitle');
const overlayArtist = document.getElementById('overlayArtist');
const overlayFill = document.getElementById('overlayFill');
const themeToggle = document.getElementById('themeToggle');
const showFavsBtn = document.getElementById('showFavsBtn');
const newPlBtn = document.getElementById('newPlBtn');

let index = 0;                      // текущий глобальный индекс трека
let activePlaylist = 'all';         // 'all', 'favorites', or playlist id number as string 'pl-<id>'
let showFavsOnly = false;           // toggle quick favorite filter

/* ---------- Playlist sidebar rendering ---------- */
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function saveFavorites(){ localStorage.setItem('favorites', JSON.stringify(favorites)); }

function renderPlaylistList(){
  playlistListEl.innerHTML = '';

  // "All tracks" virtual
  const allEl = document.createElement('div');
  allEl.className = 'pl-item ' + (activePlaylist==='all'? 'active': '');
  allEl.innerHTML = `<div class="name">All tracks</div><div class="pl-controls"></div>`;
  allEl.onclick = ()=>{ activePlaylist='all'; renderPlaylistList(); renderPlaylist(); };
  playlistListEl.appendChild(allEl);

  // "Favorites" virtual
  const favEl = document.createElement('div');
  favEl.className = 'pl-item ' + (activePlaylist==='favorites'? 'active': '');
  favEl.innerHTML = `<div class="name">Favorites (${favorites.length})</div><div class="pl-controls"></div>`;
  favEl.onclick = ()=>{ activePlaylist='favorites'; renderPlaylistList(); renderPlaylist(); };
  playlistListEl.appendChild(favEl);

  // user playlists
  state.playlists.forEach(pl=>{
    const el = document.createElement('div');
    el.className = 'pl-item ' + (activePlaylist === `pl-${pl.id}`? 'active':'');
    el.innerHTML = `<div class="name">${pl.name} (${pl.tracks.length})</div>
      <div class="pl-controls">
        <button class="btn rename" data-id="${pl.id}" title="Переименовать">✎</button>
        <button class="btn del" data-id="${pl.id}" title="Удалить">🗑</button>
      </div>`;
    el.onclick = (e)=>{ if(e.target.closest('.btn')) return; activePlaylist = `pl-${pl.id}`; renderPlaylistList(); renderPlaylist(); };
    playlistListEl.appendChild(el);
  });

  // attach rename/delete
  playlistListEl.querySelectorAll('.btn.rename').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); const id = Number(b.dataset.id); renamePlaylist(id); };
  });
  playlistListEl.querySelectorAll('.btn.del').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); const id = Number(b.dataset.id); deletePlaylist(id); };
  });
}

/* ---------- Playlist operations ---------- */
function createPlaylist(name = 'Новый плейлист'){
  const pl = { id: state.nextId++, name: name, tracks: [] };
  state.playlists.push(pl);
  saveState();
  renderPlaylistList();
  // switch to it
  activePlaylist = `pl-${pl.id}`;
  renderPlaylist();
  return pl;
}

function renamePlaylist(id){
  const pl = state.playlists.find(p=>p.id===id);
  if(!pl) return;
  const name = prompt('Новое название плейлиста', pl.name);
  if(name && name.trim()){
    pl.name = name.trim();
    saveState(); renderPlaylistList();
  }
}

function deletePlaylist(id){
  if(!confirm('Удалить плейлист?')) return;
  state.playlists = state.playlists.filter(p=>p.id!==id);
  saveState();
  if(activePlaylist === `pl-${id}`) activePlaylist = 'all';
  renderPlaylistList(); renderPlaylist();
}

function addTrackToPlaylist(playlistId, trackIndex){
  const pl = state.playlists.find(p=>p.id===playlistId);
  if(!pl) return;
  if(!pl.tracks.includes(trackIndex)) pl.tracks.push(trackIndex);
  saveState(); renderPlaylistList(); renderPlaylist();
}

function removeTrackFromPlaylist(playlistId, trackIndex){
  const pl = state.playlists.find(p=>p.id===playlistId);
  if(!pl) return;
  pl.tracks = pl.tracks.filter(i=> i!==trackIndex);
  saveState(); renderPlaylistList(); renderPlaylist();
}

/* ---------- Playlist content rendering ---------- */
function getDisplayedIndices(){
  // return array of track indices to display based on activePlaylist
  if(activePlaylist === 'all'){
    return tracks.map((t,i)=>i);
  } else if(activePlaylist === 'favorites'){
    return favorites.slice();
  } else if(activePlaylist.startsWith('pl-')){
    const id = Number(activePlaylist.split('-')[1]);
    const pl = state.playlists.find(p=>p.id===id);
    return pl ? pl.tracks.slice() : [];
  }
  return [];
}

function renderPlaylist(){
  playlistEl.innerHTML = '';
  const indices = getDisplayedIndices();
  if(indices.length === 0){
    emptyMsg.style.display = 'block';
    return;
  } else {
    emptyMsg.style.display = 'none';
  }

  indices.forEach((i)=>{
    const t = tracks[i];
    const isFav = favorites.includes(i);
    const tr = document.createElement('div');
    tr.className = 'track';
    tr.innerHTML = `
      <div class="thumb" style="background-image:url('${t.cover}')"></div>
      <div class="meta">
        <div class='t'>${t.title}</div>
        <div class='a'>${t.artist}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <div class="heart ${isFav? 'active':''}" data-id="${i}">${isFav? '❤️':'🤍'}</div>
        <button class="add-btn" data-id="${i}" title="Добавить в плейлист">＋</button>
      </div>
    `;
    tr.onclick = (e)=>{
      if(e.target.closest('.heart') || e.target.closest('.add-btn')) return;
      index = i; loadTrack(i); play();
    };
    playlistEl.appendChild(tr);
  });

  attachHeartEvents();
  attachAddButtons();
  updateActiveTrackClass();
}

/* ---------- Heart (favorites) ---------- */
function attachHeartEvents(){
  document.querySelectorAll('.heart').forEach(h=>{
    h.onclick = (e)=>{ e.stopPropagation(); const id = Number(h.dataset.id); toggleFavorite(id); };
  });
}
function toggleFavorite(id){
  if(favorites.includes(id)){
    favorites = favorites.filter(x=> x!== id);
  } else {
    favorites.push(id);
  }
  favorites = Array.from(new Set(favorites));
  saveFavorites();
  renderPlaylistList();
  renderPlaylist();
}

/* ---------- Add-to-playlist menu ---------- */
let menuVisible = false;
function attachAddButtons(){
  document.querySelectorAll('.add-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const rect = btn.getBoundingClientRect();
      const trackIndex = Number(btn.dataset.id);
      openPlaylistMenu(trackIndex, rect.right + 6, rect.top);
    };
  });
  // hide menu on outside click
  document.addEventListener('click', ()=>{
    if(menuVisible){ playlistMenu.style.display='none'; menuVisible=false; }
  }, {once:false});
}

function openPlaylistMenu(trackIndex, x, y){
  playlistMenu.innerHTML = '';
  // position
  playlistMenu.style.left = x + 'px';
  playlistMenu.style.top = y + 'px';
  // favorites toggler
  const favRow = document.createElement('div');
  favRow.className = 'row';
  const inFav = favorites.includes(trackIndex);
  favRow.innerHTML = `<div>${inFav? 'Убрать из избранного':'Добавить в избранное'}</div><div>${inFav? '−':'+'}</div>`;
  favRow.onclick = (e)=>{ e.stopPropagation(); if(inFav) favorites = favorites.filter(x=> x!== trackIndex); else favorites.push(trackIndex); saveFavorites(); renderPlaylistList(); renderPlaylist(); playlistMenu.style.display='none'; menuVisible=false; };
  playlistMenu.appendChild(favRow);

  // list user playlists with check/uncheck
  state.playlists.forEach(pl=>{
    const row = document.createElement('div'); row.className='row';
    const has = pl.tracks.includes(trackIndex);
    row.innerHTML = `<div>${pl.name}</div><div>${has? '✓' : ''}</div>`;
    row.onclick = (e)=>{ e.stopPropagation(); if(has) removeTrackFromPlaylist(pl.id, trackIndex); else addTrackToPlaylist(pl.id, trackIndex); playlistMenu.style.display='none'; menuVisible=false; };
    playlistMenu.appendChild(row);
  });

  // input to create new playlist and add there
  const inputWrap = document.createElement('div'); inputWrap.style.paddingTop='8px';
  inputWrap.innerHTML = `<div style="font-size:12px;color:var(--muted);padding-bottom:6px">Создать плейлист и добавить:</div>
    <div class="input-inline"><input id="tmpPlName" placeholder="Название плейлиста"><button id="tmpPlCreate" class="btn">Создать</button></div>`;
  playlistMenu.appendChild(inputWrap);
  // events
  setTimeout(()=>{ // allow element to be in DOM
    const createBtn = document.getElementById('tmpPlCreate');
    const tmpName = document.getElementById('tmpPlName');
    createBtn.onclick = (e)=>{ e.stopPropagation(); const name = (tmpName.value || 'Новый плейлист').trim(); const pl = createPlaylist(name); addTrackToPlaylist(pl.id, trackIndex); playlistMenu.style.display='none'; menuVisible=false; };
    tmpName.onkeydown = (e)=>{ if(e.key==='Enter'){ createBtn.click(); } };
  },0);

  playlistMenu.style.display='block';
  menuVisible = true;
}

/* ---------- Active CSS class for track ---------- */
function updateActiveTrackClass(){
  document.querySelectorAll('.track').forEach(tr=> tr.classList.remove('active'));
  // find .track that contains .heart[data-id=index]
  const heart = document.querySelector(`.heart[data-id='${index}']`);
  if(heart){
    const tr = heart.closest('.track');
    if(tr) tr.classList.add('active');
  }
}

/* ---------- Player basic logic (unchanged) ---------- */
function loadTrack(i){
  const t = tracks[i];
  audio.src = t.src;
  titleEl.textContent = t.title; artistEl.textContent = t.artist;
  coverEl.style.backgroundImage = `url('${t.cover}')`;
  overlayCover.style.backgroundImage = `url('${t.cover}')`;
  overlayTitle.textContent = t.title; overlayArtist.textContent = t.artist;
  document.getElementById('blur-bg').style.backgroundImage = `url('${t.cover}')`;
  updateActiveTrackClass();
}
function play(){ audio.play().catch(()=>{}); playBtn.textContent='⏸'; overlayPlay.textContent='⏸'; coverEl.classList.add('playing'); }
function pause(){ audio.pause(); playBtn.textContent='▶'; overlayPlay.textContent='▶'; coverEl.classList.remove('playing'); }
playBtn.onclick = ()=> audio.paused? play(): pause();
const overlayPlay = document.getElementById('overlayPlay');
overlayPlay.onclick = ()=> audio.paused? play(): pause();
prevBtn.onclick = ()=>{ index=(index-1+tracks.length)%tracks.length; loadTrack(index); play(); };
nextBtn.onclick = ()=>{ index=(index+1)%tracks.length; loadTrack(index); play(); };
audio.ontimeupdate = ()=>{ if(audio.duration){ const pct = (audio.currentTime/audio.duration)*100; progressFill.style.width = pct+'%'; overlayFill.style.width = pct+'%'; curTime.textContent = formatTime(audio.currentTime); durTime.textContent = formatTime(audio.duration); } };
document.getElementById('progressBar').parentElement.addEventListener('click', (e)=>{ const rect = e.currentTarget.getBoundingClientRect(); const x = e.clientX - rect.left; const pct = x/rect.width; if(audio.duration) audio.currentTime = pct*audio.duration; });
volume.oninput = ()=>{ audio.volume = volume.value; };
audio.onended = ()=>{ index=(index+1)%tracks.length; loadTrack(index); play(); };
function formatTime(s){ if(!s && s!==0) return '0:00'; const m=Math.floor(s/60); const sec=Math.floor(s%60).toString().padStart(2,'0'); return `${m}:${sec}` }
themeToggle.onclick = ()=>{ const root=document.body; root.getAttribute('data-theme')==='dark'? root.setAttribute('data-theme','light'): root.setAttribute('data-theme','dark'); }
openFull.onclick = ()=> overlay.classList.add('show'); closeFull.onclick = ()=> overlay.classList.remove('show');
let touchStartX=0;document.addEventListener('touchstart', e=>{ if(e.touches) touchStartX=e.touches[0].clientX }); document.addEventListener('touchend', e=>{ if(e.changedTouches){ const dx = e.changedTouches[0].clientX - touchStartX; if(dx>80) { prevBtn.click(); } else if(dx<-80) { nextBtn.click(); } } });

/* ---------- Visualizer (unchanged) ---------- */
const ctx = new (window.AudioContext||window.webkitAudioContext)();
const srcNode = ctx.createMediaElementSource(audio);
const analyser = ctx.createAnalyser(); analyser.fftSize = 2048; const bufferLength = analyser.frequencyBinCount; const dataArr = new Uint8Array(bufferLength);
const gainNode = ctx.createGain(); gainNode.gain.value = 1;
srcNode.connect(gainNode); gainNode.connect(analyser); analyser.connect(ctx.destination);

const canvas = document.getElementById('visualizer'); const cctx = canvas.getContext('2d');
function resizeCanv(){ canvas.width = canvas.clientWidth*devicePixelRatio; canvas.height = canvas.clientHeight*devicePixelRatio; cctx.setTransform(1,0,0,1,0,0); cctx.scale(devicePixelRatio, devicePixelRatio); }
window.addEventListener('resize', ()=>{ resizeCanv(); }); resizeCanv();
function draw(){ requestAnimationFrame(draw); analyser.getByteFrequencyData(dataArr); cctx.clearRect(0,0,canvas.clientWidth, canvas.clientHeight); const bars = 64; const barWidth = canvas.clientWidth/bars; for(let i=0;i<bars;i++){ const val = dataArr[Math.floor(i*(bufferLength/bars))]; const h = (val/255)*canvas.clientHeight; const x = i*barWidth; const grad = cctx.createLinearGradient(x,0,x,h); grad.addColorStop(0,'rgba(29,185,84,1)'); grad.addColorStop(1,'rgba(125,243,168,0.25)'); cctx.fillStyle = grad; cctx.fillRect(x, canvas.clientHeight-h, barWidth*0.8, h); } }
const overlayCanvas = document.getElementById('overlayViz'); const octx = overlayCanvas.getContext('2d');
function resizeOverlay(){ overlayCanvas.width = overlayCanvas.clientWidth*devicePixelRatio; overlayCanvas.height = overlayCanvas.clientHeight*devicePixelRatio; octx.setTransform(1,0,0,1,0,0); octx.scale(devicePixelRatio, devicePixelRatio); }
window.addEventListener('resize', resizeOverlay); resizeOverlay();
function drawOverlay(){ requestAnimationFrame(drawOverlay); analyser.getByteFrequencyData(dataArr); octx.clearRect(0,0,overlayCanvas.clientWidth, overlayCanvas.clientHeight); const bars = 80; const bw = overlayCanvas.clientWidth/bars; for(let i=0;i<bars;i++){ const val = dataArr[Math.floor(i*(bufferLength/bars))]; const h = (val/255)*overlayCanvas.clientHeight; const x = i*bw; const g = octx.createLinearGradient(x,0,x,h); g.addColorStop(0,'rgba(29,185,84,1)'); g.addColorStop(1,'rgba(255,255,255,0.05)'); octx.fillStyle = g; octx.fillRect(x, overlayCanvas.clientHeight-h, bw*0.8, h); } }
function bassLoop(){ requestAnimationFrame(bassLoop); analyser.getByteFrequencyData(dataArr); let sum=0; let count=0; for(let i=0;i<bufferLength*0.12;i++){ sum += dataArr[i]; count++; } const avg = (count>0)? (sum/count) : 0; document.getElementById('blur-bg').style.filter = `blur(${30 + (avg/255)*20}px) saturate(${0.6 + (avg/255)*0.8}) brightness(${0.35 + (avg/255)*0.8})`; }
function startVisualsOnce(){ if(ctx.state==='suspended') ctx.resume(); draw(); drawOverlay(); bassLoop(); document.removeEventListener('click', startVisualsOnce); }
document.addEventListener('click', startVisualsOnce);

/* ---------- Buttons: new playlist, fav filter ---------- */
newPlBtn.onclick = ()=>{
  const name = prompt('Название плейлиста:','Новый плейлист');
  if(name && name.trim()) createPlaylist(name.trim());
};

showFavsBtn.onclick = ()=>{
  activePlaylist = (activePlaylist === 'favorites')? 'all' : 'favorites';
  renderPlaylistList(); renderPlaylist();
};

/* ---------- Init ---------- */
renderPlaylistList();
renderPlaylist();
loadTrack(index);

</script>
